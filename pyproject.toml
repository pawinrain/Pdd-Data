[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pdd-data-mcp"
version = "0.1.0"
description = "Offline-first PDD read-only data snapshot MCP service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PDD Data MCP" }]
dependencies = [
  "filelock==3.19.1",
  "mcp==2.1.1",
  "playwright==1.62.0",
  "pydantic==2.13.5",
  "tzdata==2025.2",
]

[project.scripts]
pdd-data-mcp = "pdd_data_mcp.cli:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdd_data_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["local_cdp: isolated loopback CDP integration using Playwright Chromium"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pdd_data_mcp"]
